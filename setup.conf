# Load order is CRITICAL!

# 1. Core ModSecurity config
Include /etc/modsecurity.d/modsecurity.conf

# 2. Override core settings  
Include /etc/modsecurity.d/modsecurity-override.conf

# 3. CRS Setup (default variables)
Include /etc/modsecurity.d/owasp-crs/crs-setup.conf

# 4. Override CRS defaults with our strict settings
Include /etc/modsecurity.d/crs-setup-override.conf

# 5. CRS Plugins
Include /etc/modsecurity.d/owasp-crs/plugins/*-config.conf
Include /etc/modsecurity.d/owasp-crs/plugins/*-before.conf

# 6. ALL CRS RULES
Include /etc/modsecurity.d/owasp-crs/rules/*.conf

# 7. CRS Plugins After
Include /etc/modsecurity.d/owasp-crs/plugins/*-after.conf

# 8. Custom includes
Include /etc/modsecurity.d/include.conf
